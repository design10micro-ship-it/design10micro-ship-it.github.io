<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#52657f">
<meta name="description" content="公考资料分析速算记忆：百分数、平方、立方、四次方、平方根练习与速查。">
<title>公考速算记忆</title>
<style>
:root{--bg:#f8f7f4;--card:#fffefa;--soft:#edf0f4;--line:#e2e5e9;--ink:#202836;--muted:#7b8493;--main:#52657f;--main2:#42536b;--ok:#1e9d57;--bad:#df4f4f;--r:15px;--shadow:0 8px 26px rgba(40,52,70,.055)}
*{box-sizing:border-box}html{background:var(--bg);min-width:320px}body{margin:0;color:var(--ink);background:radial-gradient(circle at 10% 0,rgba(82,101,127,.05),transparent 30rem),var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}.hide{display:none!important}
header{height:56px;background:rgba(255,254,251,.94);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}.head{max-width:1160px;height:100%;margin:auto;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:9px;font-weight:750;white-space:nowrap}.logo{width:30px;height:30px;border-radius:6px;background:var(--main);color:#fff;display:grid;place-items:center;font-size:15px}.nav{display:flex;padding:4px;background:var(--soft);border-radius:9px}.nav button{border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}.nav button.active{background:var(--main);color:#fff;box-shadow:0 2px 6px #52657f33}
main{width:min(1120px,calc(100% - 36px));margin:auto;padding:38px 0 42px}.page{animation:in .18s ease}@keyframes in{from{opacity:.3;transform:translateY(3px)}}.hero{text-align:center;margin:1px 0 26px}.hero .book{width:38px;height:38px;border-radius:8px;background:#e8ebef;color:var(--main);display:grid;place-items:center;margin:0 auto 12px;font-size:20px}.hero h1{margin:0;font-size:clamp(24px,4vw,30px);letter-spacing:.04em}.hero p{margin:5px 0 0;color:var(--muted);font-size:13px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:4px;border-radius:9px;background:#e8ebef}.seg button{min-height:31px;border:0;border-radius:6px;background:transparent;cursor:pointer;padding:5px 12px;white-space:nowrap}.seg button.active{background:var(--card);box-shadow:0 1px 4px #1e293b14}.direction{text-align:center}.direction .seg{display:inline-grid;margin-top:14px}.direction button{color:var(--muted)}.direction button.active{color:var(--ink)}
.card{min-height:196px;margin-top:28px;border:1px solid var(--line);border-radius:var(--r);background:rgba(255,254,250,.8);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;position:relative;transition:.18s}.card.ok{background:#edf9f2;border-color:#a9dfbf}.card.bad{background:#fff1f1;border-color:#efb3b3}.badge{padding:4px 11px;background:#e9edf2;color:#66758a;border-radius:6px;font-size:12px}.prompt{margin-top:15px;color:var(--muted);font-size:14px}.question{margin-top:7px;min-height:66px;display:flex;align-items:baseline;justify-content:center;gap:7px;font-variant-numeric:tabular-nums}.qmain{font-size:clamp(45px,8vw,58px);font-weight:780;letter-spacing:-.04em;line-height:1.1}.qmain sup{font-size:.48em;position:relative;top:-.7em;margin-left:2px}.suffix{font-size:18px;color:var(--muted)}.exam{position:absolute;top:16px;right:17px;border:1px solid #ecd8ad;background:#fff5df;color:#95641d;border-radius:99px;padding:5px 9px;font-size:12px}
.answer{display:grid;grid-template-columns:1fr auto auto;gap:12px;margin-top:26px}.answer input,.search{height:46px;border:1px solid #cbd1d9;border-radius:6px;background:#ffffffaa;padding:0 13px;outline:0;color:var(--ink)}.answer input:focus,.search:focus{border-color:var(--main);box-shadow:0 0 0 3px #52657f1f}.primary,.reset{border:0;border-radius:5px;cursor:pointer;font-weight:700}.primary{min-width:76px;padding:0 20px;background:var(--main);color:#fff}.primary:hover{background:var(--main2)}.reset{width:46px;background:#e7ecf2;color:var(--main);font-size:18px}.feedback{height:28px;margin-top:7px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:650;text-align:center}.feedback.ok{color:var(--ok)}.feedback.bad{color:var(--bad)}
.stats{margin-top:92px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stat{min-height:100px;border:1px solid var(--line);border-radius:13px;background:#fffefaaf;box-shadow:0 5px 16px #303b4d0a;display:grid;place-items:center;text-align:center;padding:14px}.stat .ico{font-size:17px;color:var(--main)}.stat:nth-child(2) .ico{color:var(--ok)}.stat:nth-child(3) .ico{color:#2874f0}.stat strong{display:block;font-size:20px;font-variant-numeric:tabular-nums}.stat span{display:block;color:var(--muted);font-size:13px;margin-top:5px}.hint{text-align:center;color:var(--muted);font-size:12px;margin:10px 0 0}
.tools{margin-top:15px}.searchbox{position:relative;margin-top:15px}.searchbox:before{content:'⌕';position:absolute;left:13px;top:9px;color:var(--muted);font-size:21px}.search{width:100%;height:40px;padding-left:40px}.meta{display:inline-block;margin-top:26px;padding:5px 11px;border-radius:5px;background:#e8edf3;color:#62738a;font-size:12px}.panel{margin-top:12px;border:1px solid var(--line);border-radius:var(--r);background:#fffefaaf;box-shadow:var(--shadow);padding:18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.item{min-height:39px;border:1px solid #e3e6ea;border-radius:6px;background:#ffffff80;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}.item .arrow{color:#9aa3af}.item b{text-align:right;color:var(--main)}.empty{text-align:center;color:var(--muted);padding:45px 10px}
.modal{position:fixed;inset:0;background:#17203388;display:grid;place-items:center;z-index:50;padding:20px}.modal>div{width:min(390px,100%);background:var(--card);border-radius:16px;padding:26px;text-align:center;box-shadow:0 20px 70px #0003}.modal h2{margin:0 0 10px}.modal p{color:var(--muted);line-height:1.7}.modal .primary{height:42px;margin-top:8px}
@media(max-width:700px){header{height:auto}.head{padding:8px 12px;align-items:flex-start}.brand{padding-top:4px}.nav{overflow:auto;max-width:73vw}.nav button{padding:7px 10px;font-size:13px}main{width:calc(100% - 24px);padding-top:30px}.seg{overflow-x:auto;grid-auto-columns:minmax(88px,1fr)}.answer{grid-template-columns:1fr auto;gap:8px}.answer .reset{grid-column:1/-1;width:100%;height:38px}.stats{margin-top:58px;gap:8px}.stat{min-height:92px;padding:10px 4px}.stat strong{font-size:18px}.grid{grid-template-columns:1fr}.panel{padding:12px}.item{font-size:14px}.qmain{font-size:48px}}
@media(max-width:430px){.brand span{display:none}.nav{max-width:calc(100vw - 68px)}.nav button{font-size:12px}.hero{margin-bottom:22px}.card{margin-top:22px;min-height:190px}.stats{grid-template-columns:1fr 1fr 1fr}.stat span{font-size:12px}.answer input{min-width:0}.primary{padding:0 14px}.feedback{height:auto;min-height:28px}}
</style>
</head>
<body>
<header><div class="head"><div class="brand"><div class="logo">▦</div><span>公考速算记忆</span></div><nav class="nav"><button data-page="percent" class="active">％ 百化分</button><button data-page="memory">▦ 数字记忆</button><button data-page="cheat">▤ 记忆速查</button></nav></div></header>
<main><section id="percent" class="page"></section><section id="memory" class="page hide"></section><section id="cheat" class="page hide"></section></main><div id="modal"></div>
<script>
const $=(s,p=document)=>p.querySelector(s),$$=(s,p=document)=>[...p.querySelectorAll(s)],rnd=a=>a[Math.floor(Math.random()*a.length)],fmt=n=>String(n).padStart(2,'0'),time=s=>fmt(Math.floor(s/60))+':'+fmt(s%60),acc=(c,t)=>t?Math.round(c/t*100)+'%':'0%';
const fractions=[];for(let d=2;d<=20;d++)for(let n=1;n<d;n++){let g=(a,b)=>b?g(b,a%b):a;if(g(n,d)===1)fractions.push({id:n+'-'+d,n,d,p:+(n/d*100).toFixed(1)})}
const unitFractions=fractions.filter(x=>x.n===1);
const make=(type,min,max,pow)=>Array.from({length:max-min+1},(_,i)=>{let n=i+min,r=type==='sqrt'?+Math.sqrt(n).toFixed(3):n**pow;return{id:type+n,n,r,expr:type==='sqrt'?'√'+n:n+'<sup>'+pow+'</sup>',show:type==='sqrt'?r.toFixed(3):String(r)}});
const data={square:make('square',1,50,2),cube:make('cube',1,30,3),fourth:make('fourth',1,20,4),sqrt:make('sqrt',2,100,0)};
const labels={square:'平方',cube:'立方',fourth:'四次方',sqrt:'平方根'};
const st={page:'percent',percent:{mode:'b2f',q:null,answer:'',status:'idle',feedback:'',total:0,correct:0,start:0,recent:[],deadline:0},memory:{cat:'square',dirMode:'forward',dir:'forward',q:null,answer:'',status:'idle',feedback:'',total:0,correct:0,start:0,recent:[]},cheat:{cat:'percent',query:''}};let timer=null,examDone=false;
function hero(title,sub,icon=''){return`<div class="hero">${icon?`<div class="book">${icon}</div>`:''}<h1>${title}</h1><p>${sub}</p></div>`}
function seg(items,active,attr){return`<div class="seg">${items.map(x=>`<button ${attr}="${x.v}" class="${x.v===active?'active':''}">${x.t}</button>`).join('')}</div>`}
function stats(s,id){return`<div class="stats"><div class="stat"><div><div class="ico">◷</div><strong id="${id}Time">${time(s.start?Math.floor((Date.now()-s.start)/1000):0)}</strong><span>用时</span></div></div><div class="stat"><div><div class="ico">◎</div><strong>${acc(s.correct,s.total)}</strong><span>正确率</span></div></div><div class="stat"><div><div class="ico">▧</div><strong>${s.total}</strong><span>已答题数</span></div></div></div>`}
function pick(arr,recent){let pool=arr.filter(x=>!recent.includes(x.id));return rnd(pool.length?pool:arr)}function addRecent(a,id){return [...a,id].slice(-5)}
function newPercent(mode=st.percent.mode,reset=false){clearTimeout(timer);let s=st.percent;if(reset)Object.assign(s,{total:0,correct:0,start:0,recent:[],deadline:mode==='exam'?Date.now()+300000:0});s.mode=mode;let kind=mode==='mix'?rnd(['b2f','f2b']):mode==='exam'?rnd(['b2f','f2b']):mode;let source=kind==='b2f'?unitFractions:fractions;let f=pick(source,s.recent);s.recent=addRecent(s.recent,f.id);s.q={...f,kind};s.answer='';s.status='idle';s.feedback='';examDone=false;renderPercent()}
function percentView(q){if(q.kind==='b2f')return{badge:'百分数',prompt:'请输入对应的分数分母',main:q.p+'%',suffix:'= 1/?',ph:'输入分母，如 8'};return{badge:'分化百',prompt:'请输入对应的百分数',main:q.n+'/'+q.d,suffix:'= ?%',ph:'输入百分数，如 12.5'}}
function renderPercent(){let s=st.percent,q=percentView(s.q);$('#percent').innerHTML=hero('百化分记忆练习','公考资料分析速算技巧 · 每日一练')+seg([{v:'b2f',t:'百化分'},{v:'f2b',t:'分化百'},{v:'mix',t:'混合'},{v:'exam',t:'考试'}],s.mode,'data-pmode')+`<div class="card ${s.status==='ok'?'ok':s.status==='bad'?'bad':''}">${s.mode==='exam'?`<span class="exam" id="examLeft">05:00</span>`:''}<span class="badge">${q.badge}</span><div class="prompt">${q.prompt}</div><div class="question"><span class="qmain">${q.main}</span><span class="suffix">${q.suffix}</span></div></div><form class="answer" id="pform"><input id="pinput" inputmode="decimal" placeholder="${q.ph}" value="${s.answer}"><button class="primary">${/ok|bad/.test(s.status)?'下一题':'提交'}</button><button class="reset" type="button" title="重置">↻</button></form><div class="feedback ${s.status}">${s.feedback}</div>${stats(s,'p')}<p class="hint">百化分只练习 1/n 型题目；输入答案后按回车提交</p>`;$$('[data-pmode]').forEach(b=>b.onclick=()=>newPercent(b.dataset.pmode,true));$('#pform').onsubmit=e=>{e.preventDefault();submitPercent()};$('#pinput').oninput=e=>s.answer=e.target.value;$('.reset',$('#percent')).onclick=()=>newPercent(s.mode,true);setTimeout(()=>$('#pinput')?.focus(),0)}
function submitPercent(){let s=st.percent;if(/ok|bad/.test(s.status)){newPercent();return}if(!s.answer.trim()){s.feedback='请先输入答案';s.status='bad';renderPercent();return}if(!s.start)s.start=Date.now();let v=parseFloat(s.answer.replace('%','')),q=s.q,ok=q.kind==='b2f'?v===q.d:Math.abs(v-q.p)<.051;s.total++;if(ok)s.correct++;s.status=ok?'ok':'bad';s.feedback=ok?'✓ 正确：'+(q.kind==='b2f'?'1/'+q.d+' = '+q.p+'%':q.n+'/'+q.d+' = '+q.p+'%'):'✕ 正确答案：'+(q.kind==='b2f'?'1/'+q.d:q.p+'%');renderPercent();timer=setTimeout(()=>st.page==='percent'&&newPercent(),1100)}
function newMemory(cat=st.memory.cat,dirMode=st.memory.dirMode,reset=false){clearTimeout(timer);let s=st.memory;if(reset)Object.assign(s,{total:0,correct:0,start:0,recent:[]});s.cat=cat;s.dirMode=dirMode;s.dir=dirMode==='mix'?rnd(['forward','reverse']):dirMode;s.q=pick(data[cat],s.recent);s.recent=addRecent(s.recent,s.q.id);s.answer='';s.status='idle';s.feedback='';renderMemory()}
function memView(s){let q=s.q;if(s.dir==='forward')return{prompt:s.cat==='sqrt'?'请输入平方根（保留三位小数）':'请输入'+labels[s.cat]+'的结果',main:q.expr,suffix:'= ?',ph:s.cat==='sqrt'?'输入结果，如 1.414':'输入结果，如 '+q.show};return{prompt:s.cat==='sqrt'?'请输入对应的被开方数':'请输入对应的底数',main:q.show,suffix:s.cat==='sqrt'?'= √?':s.cat==='square'?'= ?²':s.cat==='cube'?'= ?³':'= ?⁴',ph:'输入数字，如 '+q.n}}
function renderMemory(){let s=st.memory,v=memView(s);$('#memory').innerHTML=hero('数字记忆练习','平方 · 立方 · 四次方 · 平方根 · 公考速算必备')+seg([{v:'square',t:'平方数'},{v:'cube',t:'立方数'},{v:'fourth',t:'四次方'},{v:'sqrt',t:'平方根'}],s.cat,'data-cat')+`<div class="direction">${seg([{v:'forward',t:'→ 正向'},{v:'reverse',t:'← 反向'},{v:'mix',t:'⤨ 混合'}],s.dirMode,'data-dir')}</div><div class="card ${s.status==='ok'?'ok':s.status==='bad'?'bad':''}"><span class="badge">${labels[s.cat]} · ${s.dir==='forward'?'正向':'反向'}</span><div class="prompt">${v.prompt}</div><div class="question"><span class="qmain">${v.main}</span><span class="suffix">${v.suffix}</span></div></div><form class="answer" id="mform"><input id="minput" inputmode="decimal" placeholder="${v.ph}" value="${s.answer}"><button class="primary">${/ok|bad/.test(s.status)?'下一题':'提交'}</button><button class="reset" type="button">↻</button></form><div class="feedback ${s.status}">${s.feedback}</div>${stats(s,'m')}<p class="hint">平方根答案需四舍五入保留三位小数</p>`;$$('[data-cat]').forEach(b=>b.onclick=()=>newMemory(b.dataset.cat,s.dirMode,true));$$('[data-dir]').forEach(b=>b.onclick=()=>newMemory(s.cat,b.dataset.dir,true));$('#mform').onsubmit=e=>{e.preventDefault();submitMemory()};$('#minput').oninput=e=>s.answer=e.target.value;$('.reset',$('#memory')).onclick=()=>newMemory(s.cat,s.dirMode,true);setTimeout(()=>$('#minput')?.focus(),0)}
function submitMemory(){let s=st.memory;if(/ok|bad/.test(s.status)){newMemory();return}if(!s.answer.trim()){s.status='bad';s.feedback='请先输入答案';renderMemory();return}if(!s.start)s.start=Date.now();let v=parseFloat(s.answer),ok=s.dir==='reverse'?v===s.q.n:s.cat==='sqrt'?Math.abs(v-s.q.r)<.00051:v===s.q.r;s.total++;if(ok)s.correct++;s.status=ok?'ok':'bad';s.feedback=ok?'✓ 正确：'+plain(s.q.expr)+' = '+s.q.show:'✕ 正确答案：'+plain(s.q.expr)+' = '+s.q.show;renderMemory();timer=setTimeout(()=>st.page==='memory'&&newMemory(),1100)}
function plain(x){return x.replace('<sup>2</sup>','²').replace('<sup>3</sup>','³').replace('<sup>4</sup>','⁴')}
function cheatRows(cat,q){let rows=cat==='percent'?fractions.map(x=>[x.n+'/'+x.d,x.p+'%']):data[cat].map(x=>[x.expr,x.show]);q=q.trim().toLowerCase();return q?rows.filter(x=>(plain(x[0])+' '+x[1]).toLowerCase().includes(q)):rows}
function renderCheat(){let s=st.cheat,items=[{v:'percent',t:'百分分数'},{v:'square',t:'平方'},{v:'cube',t:'立方'},{v:'fourth',t:'四次方'},{v:'sqrt',t:'平方根'}],rows=cheatRows(s.cat,s.query),name=items.find(x=>x.v===s.cat).t;$('#cheat').innerHTML=hero('记忆速查表','公考速算必备公式 · 随时翻阅背诵','▤')+`<div class="tools">${seg(items,s.cat,'data-ccat')}<div class="searchbox"><input class="search" id="search" placeholder="搜索${name}…" value="${s.query}"></div></div><span class="meta">${name} · 共 ${rows.length} 条</span><div class="panel">${rows.length?`<div class="grid">${rows.map(x=>`<div class="item"><span>${x[0]}</span><span class="arrow">→</span><b>${x[1]}</b></div>`).join('')}</div>`:'<div class="empty">没有找到匹配内容</div>'}</div>`;$$('[data-ccat]').forEach(b=>b.onclick=()=>{s.cat=b.dataset.ccat;s.query='';renderCheat()});$('#search').oninput=e=>{s.query=e.target.value;let pos=e.target.selectionStart;renderCheat();$('#search').focus();$('#search').setSelectionRange(pos,pos)}}
function switchPage(p){st.page=p;$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$$('.page').forEach(x=>x.classList.add('hide'));$('#'+p).classList.remove('hide');p==='percent'?renderPercent():p==='memory'?renderMemory():renderCheat();scrollTo({top:0,behavior:'smooth'})}
function examLeft(){return Math.max(0,Math.ceil((st.percent.deadline-Date.now())/1000))}function finishExam(){if(examDone||st.percent.mode!=='exam'||!st.percent.deadline)return;examDone=true;clearTimeout(timer);let s=st.percent;$('#modal').innerHTML=`<div class="modal"><div><h2>考试结束</h2><p>本次共完成 <b>${s.total}</b> 题，答对 <b>${s.correct}</b> 题，正确率为 <b>${acc(s.correct,s.total)}</b>。</p><button class="primary" id="again">重新开始</button></div></div>`;$('#again').onclick=()=>{$('#modal').innerHTML='';newPercent('exam',true)}}
setInterval(()=>{[['p',st.percent],['m',st.memory]].forEach(([id,s])=>{let e=$('#'+id+'Time');if(e)e.textContent=time(s.start?Math.floor((Date.now()-s.start)/1000):0)});if(st.percent.mode==='exam'&&st.percent.deadline){let n=examLeft(),e=$('#examLeft');if(e)e.textContent=time(n);if(n<=0)finishExam()}},250);
$$('.nav button').forEach(b=>b.onclick=()=>switchPage(b.dataset.page));st.percent.q={};newPercent('b2f',true);newMemory('square','forward',true);renderCheat();switchPage('percent');
</script>
</body></html>
